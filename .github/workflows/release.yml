name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  quality:
    name: Quality and privacy gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Poppler and Italian Tesseract data
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-ita
          command -v pdfimages
          command -v pdftotext
          test -s /usr/share/tesseract-ocr/5/tessdata/ita.traineddata

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application, tests and fixture scripts
        run: npm run typecheck:all

      - name: Unit tests
        run: npm run test:unit

      - name: OCR quality corpus
        run: npm run test:corpus

      - name: Real Tesseract roundtrip
        run: npm run test:roundtrip
        env:
          ANONIMATOR_TESSDATA: /usr/share/tesseract-ocr/5/tessdata/ita.traineddata

      - name: Pixel leak tests with Poppler
        run: npm run test:pixel-leak

  build-windows:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --config electron-builder.config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/*.exe
          if-no-files-found: error
          retention-days: 1

  build-mac-arm64:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package macOS arm64 DMG
        run: npx electron-builder --mac --arm64 --config electron-builder.config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mac-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-mac-x64:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest    # ARM runner, cross-compila x64 (macos-13 ritirato dic 2025)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install sharp x64 binaries for cross-compilation
        run: npm install @img/sharp-darwin-x64 @img/sharp-libvips-darwin-x64 --force --no-save

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package macOS x64 DMG
        run: npx electron-builder --mac --x64 --config electron-builder.config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mac-x64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package Linux AppImage
        run: npx electron-builder --linux --x64 --config electron-builder.config.js --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-windows, build-mac-arm64, build-mac-x64, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Un tag di prerelease (v1.6.0-beta.1) non ha una voce di CHANGELOG
          # propria: si ricade sulle note della versione base (1.6.0). La
          # corrispondenza esatta si tenta per prima, cosi' una beta con voce
          # dedicata resta comunque possibile.
          if [ -z "$NOTES" ]; then
            BASE="${VERSION%%-*}"
            NOTES=$(awk "/^## \\[$BASE\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md)
            NOTES="> **Versione di prova ($VERSION).** Non usare su fascicoli reali senza verificare a mano il risultato."$'\n\n'"$NOTES"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anonimator ${{ github.ref_name }}"
          body: |
            ## Installazione

            Scarica il file per il tuo sistema operativo:
            - **Mac Apple Silicon (M1/M2/M3/M4):** `*-arm64.dmg`
            - **Mac Intel:** `*-x64.dmg`
            - **Windows:** `*-setup.exe`
            - **Linux:** `*-linux-x64.AppImage`

            Trascina `Anonimator.app` nella cartella Applicazioni, poi esegui una volta:
            ```bash
            sudo xattr -cr /Applications/Anonimator.app
            ```

            ---

            ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/mac-arm64-dmg/*.dmg
            artifacts/mac-x64-dmg/*.dmg
            artifacts/windows-installer/*.exe
            artifacts/linux-appimage/*.AppImage
          draft: false
          # Qualunque tag con suffisso semver (v1.6.0-beta.1, -rc.2) e' una
          # prerelease: su GitHub resta fuori da "Latest release".
          prerelease: ${{ contains(github.ref_name, '-') }}
